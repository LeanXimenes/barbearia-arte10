# ---------------------------------------------------------------------
# Barbearia Arte 10 — deploy do site publico no Netlify
# ---------------------------------------------------------------------
# As variaveis VITE_SUPABASE_URL e VITE_SUPABASE_ANON_KEY precisam ser
# cadastradas em: Site configuration > Environment variables.
# Nenhuma credencial fica neste arquivo.
# ---------------------------------------------------------------------

[build]
  base = "web"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Aplicacao de pagina unica: qualquer rota cai no index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cabeçalhos de segurança (CSP, frame, etc.): ficam em web/public/_headers,
# que vale também para o painel publicado arrastando a pasta. Um lugar só,
# para os dois sites nunca ficarem diferentes.
